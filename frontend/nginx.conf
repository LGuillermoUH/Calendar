server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API al backend (mismo origen -> sin CORS).
    # 'backend' es el nombre del servicio en el compose; resuelve por la red
    # interna de Docker. El backend escucha en :8080.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health del backend a traves del mismo origen.
    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
    }

    # Fallback SPA: cualquier ruta no encontrada devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets con hash.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
